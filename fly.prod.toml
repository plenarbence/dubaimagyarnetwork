# fly.toml app configuration file generated for dmn-backend-dev on 2025-12-31T09:54:52+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dmn-backend-prod'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'production'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
